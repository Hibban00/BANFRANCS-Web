<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CRUD Productos | BANFRANCS</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Gestión de Productos BANFRANCS</h1>

      <form method="POST">
        <div class="mb-3">
          <label>Código</label>
          <input
            type="text"
            name="codigo"
            class="form-control"
            value="{{ codigo }}"
          />
        </div>

        <div class="mb-3">
          <label>Nombre</label>
          <input
            type="text"
            name="nombre"
            class="form-control"
            value="{{ nombre }}"
          />
        </div>

        <div class="mb-3">
          <label>Precio</label>
          <input
            type="number"
            step="0.01"
            name="precio"
            class="form-control"
            value="{{ precio }}"
          />
        </div>

        <div class="mb-3">
          <button
            type="submit"
            name="accion"
            value="guardar"
            class="btn btn-success"
          >
            Guardar
          </button>

          <button
            type="submit"
            name="accion"
            value="buscar"
            class="btn btn-primary"
          >
            Buscar
          </button>

          <button
            type="submit"
            name="accion"
            value="modificar"
            class="btn btn-warning"
          >
            Modificar
          </button>

          <button
            type="submit"
            name="accion"
            value="eliminar"
            class="btn btn-danger"
          >
            Eliminar
          </button>
        </div>

        <div class="alert alert-info">{{ mensaje }}</div>
      </form>
    </div>
  </body>
</html>
