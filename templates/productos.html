<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CRUD Productos | BANFRANCS</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Gestión de Productos BANFRANCS</h1>
      <p class="text-center text-muted">
        Total de productos registrados: {{ productos|length }}
      </p>

      <form method="POST">
        <div class="mb-3">
          <label>Código</label>
          <input
            type="text"
            name="codigo"
            class="form-control"
            value="{{ codigo }}"
          />
        </div>

        <div class="mb-3">
          <label>Nombre</label>
          <input
            type="text"
            name="nombre"
            class="form-control"
            value="{{ nombre }}"
          />
        </div>

        <div class="mb-3">
          <label>Precio</label>
          <input
            type="number"
            step="0.01"
            name="precio"
            class="form-control"
            value="{{ precio }}"
          />
        </div>

        <div class="mb-3">
          <button
            type="submit"
            name="accion"
            value="guardar"
            class="btn btn-success"
          >
            Guardar
          </button>

          <button
            type="submit"
            name="accion"
            value="buscar"
            class="btn btn-primary"
          >
            Buscar
          </button>

          <button
            type="submit"
            name="accion"
            value="modificar"
            class="btn btn-warning"
          >
            Modificar
          </button>

          <button
            type="submit"
            name="accion"
            value="eliminar"
            class="btn btn-danger"
          >
            Eliminar
          </button>
        </div>

        <div class="alert alert-info">{{ mensaje }}</div>
      </form>
      <hr />

      <h2 class="mt-4">Lista de Productos</h2>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
          </tr>
        </thead>

        <tbody>
          {% for producto in productos %}

          <tr>
            <td>{{ producto[0] }}</td>
            <td>{{ producto[1] }}</td>
            <td>S/ {{ producto[2] }}</td>
          </tr>

          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
