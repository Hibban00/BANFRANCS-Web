<form method="POST">
  <div class="mb-3">
    <label>Código</label>
    <input
      type="text"
      name="codigo"
      class="form-control"
      value="{{ codigo }}"
    />
  </div>

  <div class="mb-3">
    <label>Nombre</label>
    <input
      type="text"
      name="nombre"
      class="form-control"
      value="{{ nombre }}"
    />
  </div>

  <div class="mb-3">
    <label>Precio</label>
    <input
      type="number"
      step="0.01"
      name="precio"
      class="form-control"
      value="{{ precio }}"
    />
  </div>

  <div class="mb-3">
    <button type="submit" name="accion_producto" value="guardar" class="btn btn-success">
      Guardar
    </button>

    <button type="submit" name="accion_producto" value="buscar" class="btn btn-primary">
      Buscar
    </button>

    <button
      type="submit"
      name="accion_producto"
      value="modificar"
      class="btn btn-warning"
    >
      Modificar
    </button>

    <button type="submit" name="accion_producto" value="eliminar" class="btn btn-danger">
      Eliminar
    </button>
  </div>

  <div class="alert alert-info">{{ mensaje }}</div>
</form>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Código</th>
      <th>Nombre</th>
      <th>Precio</th>
    </tr>
  </thead>

  <tbody>
    {% for producto in productos %}

    <tr>
      <td>{{ producto[0] }}</td>
      <td>{{ producto[1] }}</td>
      <td>S/ {{ producto[2] }}</td>
    </tr>

    {% endfor %}
  </tbody>
</table>
