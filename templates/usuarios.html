<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Usuarios BANFRANCS</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Gestión de Usuarios</h1>

      <form method="POST">
        <div class="mb-3">
          <label>Usuario</label>
          <input
            type="text"
            name="usuario"
            class="form-control"
            placeholder="Ingrese usuario"
          />
        </div>

        <div class="mb-3">
          <label>Contraseña</label>
          <input
            type="text"
            name="password"
            class="form-control"
            value="{{ password }}"
          />
        </div>

        <button
          type="submit"
          name="accion"
          value="guardar"
          class="btn btn-success"
        >
          Guardar
        </button>

        <button
          type="submit"
          name="accion"
          value="buscar"
          class="btn btn-primary"
        >
          Buscar
        </button>

        <button
          type="submit"
          name="accion"
          value="modificar"
          class="btn btn-warning"
        >
          Modificar
        </button>

        <button
          type="submit"
          name="accion"
          value="eliminar"
          class="btn btn-danger"
        >
          Eliminar
        </button>

        <div class="alert alert-info mt-3">{{ mensaje }}</div>
      </form>
    </div>
  </body>
</html>
